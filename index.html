<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Conteúdos para aprovação · bey</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1A1A1A;color:#F2F2F2;font-family:Montserrat,system-ui,sans-serif}.c{text-align:center;padding:24px}.d{width:42px;height:42px;border-radius:50%;border:4px solid #504BB7;border-top-color:#957FEF;margin:0 auto 18px;animation:g 1s linear infinite}@keyframes g{to{transform:rotate(360deg)}}p{font-weight:300;font-size:15px}</style>
</head><body><div class="c"><div class="d" id="d"></div><p id="m">carregando...</p></div>
<script>
var API='https://script.google.com/macros/s/AKfycbyKdHvmGlQukk9V-qW3qCHivSH1VOVG7F5xX0kTmM4GGY7tSkS5E--bUKS9ioHVIMEE/exec';
var p=new URLSearchParams(location.search);
fetch(API+'?api=pagina&e='+encodeURIComponent(p.get('e')||'')).then(function(r){return r.json()}).then(function(j){
  if(j.erro){document.getElementById('d').style.display='none';document.getElementById('m').textContent=j.erro;return}
  document.open();document.write(j.html);document.close();if(j.titulo)document.title=j.titulo;
}).catch(function(){document.getElementById('d').style.display='none';document.getElementById('m').textContent='Não foi possível carregar. Verifique sua internet e tente de novo.'});
</script></body></html>
